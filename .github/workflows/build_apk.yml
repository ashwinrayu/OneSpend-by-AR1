name: Build Android APK & Web Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/keep_alive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OneSpend Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Signing Keystore
        run: |
          keytool -list -keystore android/app/onespend.keystore -storepass onespend123

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneSpend-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Publish to GitHub Releases for Cloud In-App Auto-Update
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.VERSION }}
          name: OneSpend ${{ env.VERSION }} (Production)
          body: |
            Automated production build from commit ${{ github.sha }}.
            • Direct In-App Cloud Auto-Updater enabled
            • Real-time bidirectional Cloud Delta Sync with Render PostgreSQL
            • Obsidian Dark & Emerald responsive UI
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
