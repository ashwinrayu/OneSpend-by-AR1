name: onespend
description: "OneSpend by AR1 — Modern offline expense tracker by AR1studios"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking & Secure Storage
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  
  # Local SQLite Persistence & Preferences
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  shared_preferences: ^2.2.3
  
  # Path & Storage
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.0.0
  
  # Formatting & Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  
  # Data Export & Visuals
  csv: ^6.0.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
